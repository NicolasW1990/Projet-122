<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon projet 122</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>🎮 Les Jeux-Vidéos</h1>
</header>

<nav>
  <span id="nav-count">0 jeu(x) affiché(s)</span>
</nav>

<main>
  <form id="form-add">
    <h2>Ajouter un jeu</h2>

    <div class="form-group">
      <label for="input-name">Nom</label>
      <input type="text" id="input-name" placeholder="Ex : The Witcher 3" required>
    </div>

    <div class="form-group">
      <label for="input-category">Catégorie</label>
      <select id="input-category">
        <option value="Action">Action</option>
        <option value="Aventure">Aventure</option>
        <option value="FPS">FPS</option>
        <option value="RPG">RPG</option>
        <option value="Stratégie">Stratégie</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-platform">Plateforme</label>
      <select id="input-platform">
        <option value="PC">PC</option>
        <option value="PS5">PS5</option>
        <option value="PS4">PS4</option>
        <option value="Xbox">Xbox</option>
        <option value="Nintendo Switch">Nintendo Switch</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-rating">Note (1–10)</label>
      <input type="number" id="input-rating" min="1" max="10" placeholder="8" required>
    </div>

    <button type="submit">➕ Ajouter</button>
  </form>

  <!-- Barre d'outils : recherche, filtre catégorie, tri -->
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 Rechercher un jeu...">

    <select id="filter-category">
      <option value="">Toutes les catégories</option>
      <option value="Action">Action</option>
      <option value="Aventure">Aventure</option>
      <option value="FPS">FPS</option>
      <option value="RPG">RPG</option>
      <option value="Stratégie">Stratégie</option>
    </select>

    <select id="sort-select">
      <option value="rating-desc">Note ↓ (DESC)</option>
      <option value="rating-asc">Note ↑ (ASC)</option>
      <option value="name-asc">Nom A → Z</option>
      <option value="name-desc">Nom Z → A</option>
      <option value="year-desc">Année ↓</option>
      <option value="year-asc">Année ↑</option>
    </select>
  </div>

  <!-- Message de feedback -->
  <p id="feedback" class="feedback hidden"></p>

  <!-- Liste des jeux -->
  <div id="list"></div>
</main>

<footer>
  <p>Projet C122 — JavaScript — ESIG 2025-2026</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
