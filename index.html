<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armées de l'Impérium — Warhammer 40 000</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>⚙️ Armées de l'Impérium</h1>
  <p class="subtitle">Warhammer 40 000 — Pour l'Empereur !</p>
</header>

<main>
  <form id="form-add">
    <h2>Ajouter une armée</h2>

    <div class="form-group">
      <label for="input-name">Nom</label>
      <input type="text" id="input-name" placeholder="Ex : Ultramarines" required>
    </div>

    <div class="form-group">
      <label for="input-category">Faction</label>
      <select id="input-category">
        <option value="Space Marines">Space Marines</option>
        <option value="Garde Impériale">Garde Impériale</option>
        <option value="Adeptus Mechanicus">Adeptus Mechanicus</option>
        <option value="Adepta Sororitas">Adepta Sororitas</option>
        <option value="Chevaliers Impériaux">Chevaliers Impériaux</option>
        <option value="Adeptus Custodes">Adeptus Custodes</option>
      </select>
    </div>

    <div class="form-group">
      <label for="input-rating">Puissance de guerre (1–10)</label>
      <input type="number" id="input-rating" min="1" max="10" placeholder="8">
    </div>

    <button type="submit" class="btn btn-primary">Ajouter</button>
  </form>

  <div class="toolbar">
    <label for="search"></label><input type="text" id="search" placeholder="Rechercher une armée...">
    <button id="btn-sort" class="btn btn-primary">Trier par puissance ↓ (DESC)</button>
  </div>

  <ul id="list"></ul>
</main>




<footer>
  <p>Projet C122 — JavaScript — ESIG 2025-2026</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
